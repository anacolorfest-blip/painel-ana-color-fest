    ':root[data-theme="dark"]{ --bg:#221A1E; --paper:#2C2226; --ink:#F3EAE7; --ink-soft:#C9B8BE; --line:#3E2E34; --amber-bg:#3A2C1B; --teal-bg:#1D2D2E; --wine-bg:#3A222C; --green-bg:#1D2E22; --red-bg:#3A2220; }',
    '.wrap{max-width:1040px; margin:0 auto;}',

    '.page-title h1{font-family:"Fraunces",serif; font-size:22px; font-weight:600; margin:0 0 3px;}',

    '.dash-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px;}',

    var m = String(d.getMonth()+1).padStart(2,'0');

    return d.getFullYear()+'-'+m+'-'+dd;

      var dow = new Date(parseInt(p[0]), parseInt(p[1])-1, parseInt(p[2])).getDay();

    }
    return atual;
  }

  function cycleBuckets(mes){
    // Agrupa entradas do mês em blocos de 5 dias (1-5, 6-10, ...)
    var buckets = {};
    state.transactions.forEach(function(tx){
      if (tx.tipo !== 'entrada' || monthKey(tx.data) !== mes) return;
      var dia = parseInt(tx.data.slice(8,10), 10);
      var ini = Math.floor((dia-1)/5)*5 + 1;
      var fim = ini + 4;
      var key = ini + '-' + fim;
      buckets[key] = (buckets[key] || 0) + (Number(tx.valor)||0);
    });
    var ordem = ['1-5','6-10','11-15','16-20','21-25','26-30','31-35'];
    return ordem.filter(function(k){ return buckets[k] !== undefined; }).map(function(k){ return {label: 'Dias '+k, valor: buckets[k]}; });
  }

  var INV_CATS = {trafego:'Tráfego pago', canva:'Canva', internet:'Internet', hospedagem:'Hospedagem', plataforma:'Plataforma', outro:'Outro investimento'};
  var INV_RECORRENTES = ['trafego','canva','internet'];

  function investTotalMes(categoria, mes){
    var t = 0;
    state.transactions.forEach(function(tx){
      if (tx.tipo === 'saida' && tx.categoria === categoria && monthKey(tx.data) === mes) t += Number(tx.valor)||0;
    });
    return t;
  }
  function investTotalGeral(){
    var t = 0;
    state.transactions.forEach(function(tx){
      if (tx.tipo === 'saida' && tx.categoria && tx.categoria !== 'pessoal') t += Number(tx.valor)||0;
    });
    return t;
  }
  function investUnicos(){
    return state.transactions.filter(function(tx){
      return tx.tipo === 'saida' && tx.categoria && INV_RECORRENTES.indexOf(tx.categoria) === -1 && tx.categoria !== 'pessoal';
    }).sort(function(a,b){ return (b.data||'').localeCompare(a.data||''); });
  }

  function renderFiltros(){
    var today = todayStr();
    var amanha = addDias(today, 1);
    var comData = state.clients.filter(function(o){ return !!o.data && o.tipoPedido && o.tipoPedido.indexOf('filtro') !== -1; });
    var hoje = comData.filter(function(o){ return o.data === today; }).sort(function(a,b){ return a.nome.localeCompare(b.nome); });
    var proximos = comData.filter(function(o){ return o.data > today; }).sort(function(a,b){ return a.data.localeCompare(b.data); });
    var passados = comData.filter(function(o){ return o.data < today; }).sort(function(a,b){ return b.data.localeCompare(a.data); }).slice(0,10);

    function fmtData(d){ return d.split('-').reverse().join('/'); }
    function corFiltro(o){
      if (o.filtroPostado) return 'green';
      if (o.data === today || o.data === amanha) return 'amber';
      return 'red';
    }

    var html = '<div class="page-title"><h1>Filtros</h1><p>Controle de repostagem do Instagram por evento</p></div>';

    function item(o, isHoje){
      var html = '<div class="filtro-item'+(isHoje?' hoje':'')+'" data-id="'+o.id+'">';
      html += '<div><div class="name"><span class="status-dot" style="background:var(--'+corFiltro(o)+');"></span>'+escapeHtml(o.nome)+(o.data===today?' — hoje':(o.data===amanha?' — amanhã':''))+'</div><div class="meta">'+fmtData(o.data)+' · '+escapeHtml(o.telefone)+(o.produto?' · '+escapeHtml(o.produto):'')+'</div></div>';
      html += '<button type="button" class="mark'+(o.filtroPostado?' done':'')+'" data-id="'+o.id+'">'+(o.filtroPostado?'Postado ✓':'Marcar postado')+'</button>';
      html += '</div>';
      return html;
    }

    html += '<div class="filtro-group"><h3>Hoje</h3>';
    if (hoje.length === 0) { html += '<div class="empty">Nenhum evento hoje.</div>'; }
    else { hoje.forEach(function(o){ html += item(o, true); }); }
    html += '</div>';

    html += '<div class="filtro-group"><h3>Próximos</h3>';
    if (proximos.length === 0) { html += '<div class="empty">Nenhum evento com data futura cadastrada.</div>'; }
    else { proximos.forEach(function(o){ html += item(o, false); }); }
    html += '</div>';

    if (passados.length > 0) {
      html += '<div class="filtro-group"><h3>Passados recentes</h3>';
      passados.forEach(function(o){ html += item(o, false); });
      html += '</div>';
    }

    html += '<div class="empty" style="border:none; padding-top:4px;">Só aparecem aqui pedidos do tipo "com filtro" com data do evento preenchida (aba Pedidos).</div>';
    return html;
  }

  function renderRelatorios(){
    var pedidos = state.clients;
    var faturados = pedidos.filter(function(o){ return pedidoStatus(o) === 'entregue'; });
    var totalPedidos = pedidos.length;
    var valorTotal = faturados.reduce(function(s,o){ return s + (Number(o.valor)||0); }, 0);
    var ticketMedio = faturados.length ? valorTotal/faturados.length : 0;
    var telefones = {}; var recorrentes = {};
    pedidos.forEach(function(o){
      if (!o.telefone) return;
      telefones[o.telefone] = (telefones[o.telefone]||0) + 1;
    });
    var qtdClientes = Object.keys(telefones).length;
    var qtdRecorrentes = Object.keys(telefones).filter(function(t){ return telefones[t] > 1; }).length;

    var porProduto = {};
    pedidos.forEach(function(o){
      var p = o.produto || 'Sem produto';
      porProduto[p] = (porProduto[p]||0) + 1;
    });
    var produtosOrdenados = Object.keys(porProduto).sort(function(a,b){ return porProduto[b]-porProduto[a]; });
    var maisVendido = produtosOrdenados[0];

    var porMes = {};
    faturados.forEach(function(o){
      var k = monthKey(o.data || o.criadoEm || todayStr());
      porMes[k] = (porMes[k]||0) + (Number(o.valor)||0);
    });
    var mesesOrdenados = Object.keys(porMes).sort();
    var maxMes = Math.max.apply(null, mesesOrdenados.map(function(k){ return porMes[k]; }).concat([1]));

    var html = '<div class="page-title"><h1>Relatórios</h1><p>Desempenho dos pedidos, atualizado automaticamente</p></div>';
    html += '<div class="dash-grid">';
    html += '<div class="dash-card"><div class="n">'+totalPedidos+'</div><div class="l">Total de pedidos</div></div>';
    html += '<div class="dash-card"><div class="n">'+fmtMoney(valorTotal)+'</div><div class="l">Valor total faturado</div></div>';
    html += '<div class="dash-card"><div class="n">'+fmtMoney(ticketMedio)+'</div><div class="l">Ticket médio</div></div>';
    html += '<div class="dash-card"><div class="n">'+qtdClientes+'</div><div class="l">Clientes</div></div>';
    html += '<div class="dash-card"><div class="n">'+qtdRecorrentes+'</div><div class="l">Clientes recorrentes</div></div>';
    html += '</div>';

    html += '<div class="card"><h2>Produto mais vendido</h2>';

      html += '<div class="inv-row" style="border:none; font-weight:600;"><span>'+escapeHtml(maisVendido)+'</span><span>'+porProduto[maisVendido]+' vendas</span></div>';
    } else {
      html += '<div class="empty">Nenhum pedido cadastrado ainda.</div>';
    }
    html += '<p class="muted" style="margin:14px 0 -2px;">Vendas por produto</p>';
    produtosOrdenados.forEach(function(p){
      html += '<div class="inv-row"><span>'+escapeHtml(p)+'</span><span>'+porProduto[p]+'</span></div>';
    });
    html += '</div>';

    html += '<div class="card"><h2>Faturamento por mês</h2>';
    if (!mesesOrdenados.length) { html += '<div class="empty">Nenhum pedido entregue/faturado ainda.</div>'; }
    mesesOrdenados.forEach(function(k){
      var pct = Math.max(4, Math.round((porMes[k]/maxMes)*100));
      html += '<div class="cycle-row"><span style="width:90px; color:var(--ink-soft); text-transform:capitalize;">'+monthLabel(k)+'</span><div class="bar" style="width:'+pct+'%;"></div><span>'+fmtMoney(porMes[k])+'</span></div>';
    });
    html += '</div>';
    return html;

    html += '<div class="topbar">' + navHtml() + '</div>';
    var pages = {dashboard:renderDashboard, pedidos:renderPedidos, financeiro:renderFinanceiro, filtros:renderFiltros, relatorios:renderRelatorios, precos:renderPrecos, notas:renderNotas};
    html += (pages[view] || renderDashboard)();
    html += '</div></div>';
    app.innerHTML = html;
    wireEvents();
  }

  function wireEvents(){
    var app = document.getElementById('app');

    app.querySelectorAll('.side-link').forEach(function(btn){
      btn.addEventListener('click', function(){
        view = btn.getAttribute('data-view');
        render();
      });
    });

    app.querySelectorAll('.quicklink').forEach(function(el){
      el.addEventListener('click', function(){
        view = el.getAttribute('data-goto');
        render();
      });
    });

    if (view === 'pedidos') {
      var valorSel = document.getElementById('f-valor');
      var outroWrap = document.getElementById('outroWrap');
      if (valorSel) {
        valorSel.addEventListener('change', function(){
          var v = valorSel.value;
          outroWrap.style.display = (v === 'outro' || v.indexOf('tema_') === 0) ? '' : 'none';
        });
      }

      var form = document.getElementById('addForm');
      if (form) {
        form.addEventListener('submit', function(ev){
          ev.preventDefault();
          var nome = document.getElementById('f-nome').value.trim();
          var telefone = document.getElementById('f-tel').value.trim();
          var valorSelEl = document.getElementById('f-valor');
          var selVal = valorSelEl.value;
          var selectedText = valorSelEl.options[valorSelEl.selectedIndex].text.replace(/ — R\$.*/, '');
          var isCustom = selVal === 'outro' || selVal.indexOf('tema_') === 0;
          var valor, produto;
          if (isCustom) {
            valor = document.getElementById('f-outro').value || 0;
            produto = selVal === 'outro' ? '' : selectedText;
          } else {
            var precoRef = state.precos.find(function(p){ return p.id === selVal; });
            valor = precoRef ? precoRef.valor : 0;
            produto = precoRef ? precoRef.nome : selectedText;
          }
          var data = document.getElementById('f-data').value;
          var tipoPedido = document.getElementById('f-tipo').value;
          var prazo = document.getElementById('f-prazo').value;
          if (!nome || !telefone) return;
          var newState = clone(state);
          newState.clients.push({
            id: 'o' + Date.now() + Math.floor(Math.random()*1000),
            nome: nome, telefone: telefone, valor: Number(valor)||0, produto: produto,
            tipoPedido: tipoPedido, prazo: prazo, criadoEm: todayStr(),
            status: 'pendente', data: data || null
          });
          save(newState);
        });
      }

      app.querySelectorAll('.tab').forEach(function(btn){
        btn.addEventListener('click', function(){
          filter = btn.getAttribute('data-filter');
          render();
        });
      });

      app.querySelectorAll('.mark-entregue').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-id');
          var newState = clone(state);
          var item = newState.clients.find(function(o){ return o.id === id; });
          if (item) {
            var novoStatus = item.status === 'entregue' ? 'pendente' : 'entregue';
            item.status = novoStatus;
            if (novoStatus === 'entregue') {
              var already = newState.transactions.some(function(t){ return t.origem === 'pedido' && t.pedidoId === id; });
              if (!already) {
                newState.transactions.push({
                  id: 't' + Date.now() + Math.floor(Math.random()*1000),
                  tipo: 'entrada',
                  categoria: 'pessoal',
                  descricao: 'Convite — ' + item.nome,
                  valor: Number(item.valor)||0,
                  data: todayStr(),
                  origem: 'pedido',
                  pedidoId: id
                });
              }
            } else {
              newState.transactions = newState.transactions.filter(function(t){ return !(t.origem === 'pedido' && t.pedidoId === id); });
            }
          }
          save(newState);
        });
      });

      app.querySelectorAll('.del[data-kind="order"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-id');
          var newState = clone(state);
          newState.clients = newState.clients.filter(function(o){ return o.id !== id; });
          newState.transactions = newState.transactions.filter(function(t){ return !(t.origem === 'pedido' && t.pedidoId === id); });
          save(newState);
        });
      });
    }

    if (view === 'financeiro') {
      app.querySelectorAll('#segTipo button').forEach(function(btn){
        btn.addEventListener('click', function(){
          txType = btn.getAttribute('data-tipo');
          render();
        });
      });

      var txForm = document.getElementById('txForm');
      if (txForm) {
        txForm.addEventListener('submit', function(ev){
          ev.preventDefault();
          var desc = document.getElementById('t-desc').value.trim();
          var valor = document.getElementById('t-valor').value;
          var data = document.getElementById('t-data').value || todayStr();
          var catEl = document.getElementById('t-cat');
          var categoria = catEl ? catEl.value : 'pessoal';
          if (!desc || !valor) return;
          var newState = clone(state);
          newState.transactions.push({
            id: 't' + Date.now() + Math.floor(Math.random()*1000),
            tipo: txType,
            categoria: categoria,
            descricao: desc,
            valor: Number(valor)||0,
            data: data,
            origem: 'manual'
          });
          save(newState);
        });
      }

      var copyBtn = document.getElementById('copyListaBtn');
      if (copyBtn) {
        copyBtn.addEventListener('click', function(){
          var vistos = {};
          var linhas = state.clients.filter(function(o){
            if (!o.telefone || vistos[o.telefone]) return false;
            vistos[o.telefone] = true;
            return true;
          }).map(function(o){ return o.nome + '\t' + o.telefone; });
          var texto = linhas.join('\n');
          if (navigator.clipboard) {
            navigator.clipboard.writeText(texto).then(function(){
              copyBtn.textContent = 'Copiado!';
              setTimeout(function(){ copyBtn.textContent = 'Copiar lista'; }, 1500);
            });
          }
        });
      }

    }

    if (view === 'filtros') {
      app.querySelectorAll('.mark').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-id');
          var newState = clone(state);
          var item = newState.clients.find(function(o){ return o.id === id; });
          if (item) item.filtroPostado = !item.filtroPostado;
          save(newState);
        });
      });
    }

    if (view === 'financeiro') {
      app.querySelectorAll('.del[data-kind="tx"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-id');
          var newState = clone(state);
          var tx = newState.transactions.find(function(t){ return t.id === id; });
          newState.transactions = newState.transactions.filter(function(t){ return t.id !== id; });
          if (tx && tx.origem === 'pedido' && tx.pedidoId) {
            var order = newState.clients.find(function(o){ return o.id === tx.pedidoId; });
            if (order) order.status = 'entregue';
          }
          save(newState);
        });
      });
    }

    if (view === 'precos') {
      var precoForm = document.getElementById('precoForm');
      if (precoForm) {
        precoForm.addEventListener('submit', function(ev){
          ev.preventDefault();
          var nome = document.getElementById('pr-nome').value.trim();
          var valor = document.getElementById('pr-valor').value;
          if (!nome || !valor) return;
          var newState = clone(state);
          newState.precos.push({id:'p'+Date.now()+Math.floor(Math.random()*1000), nome: nome, valor: Number(valor)||0});
          save(newState);
        });
      }
      app.querySelectorAll('.preco-nome').forEach(function(el){
        el.addEventListener('click', function(){
          var id = el.closest('.inv-row').getAttribute('data-id');
          var atual = state.precos.find(function(p){ return p.id === id; });
          if (!atual) return;
          var novo = prompt('Nome do produto:', atual.nome);
          if (novo === null || !novo.trim()) return;
          var newState = clone(state);
          newState.precos.find(function(p){ return p.id === id; }).nome = novo.trim();
          save(newState);
        });
      });
      app.querySelectorAll('.preco-valor').forEach(function(el){
        el.addEventListener('click', function(){
          var id = el.closest('.inv-row').getAttribute('data-id');
          var atual = state.precos.find(function(p){ return p.id === id; });
          if (!atual) return;
          var novo = prompt('Novo valor (R$):', atual.valor);
          if (novo === null || isNaN(parseFloat(novo))) return;
          var newState = clone(state);
          newState.precos.find(function(p){ return p.id === id; }).valor = parseFloat(novo);
          save(newState);
        });
      });
      app.querySelectorAll('.del[data-kind="preco"]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-id');
          var newState = clone(state);
          newState.precos = newState.precos.filter(function(p){ return p.id !== id; });
          save(newState);
        });
      });
    }

    if (view === 'notas') {
      var salvarBtn = document.getElementById('salvarNotasBtn');
      if (salvarBtn) {
        salvarBtn.addEventListener('click', function(){
          var texto = document.getElementById('notasArea').value;
          var newState = clone(state);
          newState.notas = texto;
          save(newState);
        });
      }
    }
  }

  render();
})();
</script>
</body>
</html>
